	<meta charset="utf-8">

	<title>Image Recognition API DEMO</title>
</head>

<div class="upload_form">
	<form id="uploadform" method="post" enctype="multipart/form-data">
		<input type="file" name="image_file" id="image_file">
		<button id="submit" type="button">Upload</button>
	</form>
</div>

<div class="sample_images">
	<a href="" class="img1"><img src="{{ url_for('uploaded_file', filename='beagle.jpg') }}" height="80" width="80"></a>
	<a href="" class="img2"><img src="{{ url_for('uploaded_file', filename='pitcher.jpg') }}" height="80" width="80"></a>
	<a href="" class="img2"><img src="{{ url_for('uploaded_file', filename='januverma.jpg') }}" height="80" width="80"></a>
</div>

<!-- The div for the results -->
<div id="result"></div>





<!-- Load jQuery -->
<script src="{{ url_for('static', filename='javascript/jquery-2.2.0.min.js') }}"></script>
<!-- <script src="{{ url_for('static', filename='javascript/bootstrap.min.js') }}"></script> -->

<!-- Load javascript source -->
<script type="text/javascript" src="{{ url_for('static', filename='javascript/image_reco.js') }}"></script>

<!-- Load flask_util_js -->
{{ fujs.js }}


<script type="text/javascript">
// Display the pre-loaded image.
	$(function(){
		$('.img1').click(function(){
			event.preventDefault();
			$('#result').text('beagle.jpg');
			$('#result').append('<img id="dynamic" height="500" width="500">');
			$('#dynamic').attr('src', flask_util.url_for("uploaded_file", {filename: 'beagle.jpg'}));
		});
	});

// Display and compute results for the uploaded image.
	$(function(){
		$('#submit').click(function(){
			event.preventDefault();
			var form_data = new FormData($('#uploadform')[0]);
			$.ajax({
				type: 'POST',
				url: '/upload',
				data: form_data,
				contentType: false,
				processData: false,
				dataType: 'json'
			})
			.success(
				function(data, textStatus, jqXHR){extract_uploaded_file(data, textStatus, jqXHR);})
			.fail(function(data){
				alert('Check file format. The allowed formats are jpg, jpeg, png');
			});
		});
	});
</script>
